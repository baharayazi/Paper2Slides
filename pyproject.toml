[project]
name = "paper2slides"
version = "0.2.0"
description = "Turn a research paper PDF into an editable PowerPoint presentation with grounded figures"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Bahar Ayazi", email = "bahar@baharayazi.com" }]
dependencies = [
    "fastapi>=0.141.1",
    "ollama>=0.6.2",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
paper2slides = "paper2slides.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper2slides"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
